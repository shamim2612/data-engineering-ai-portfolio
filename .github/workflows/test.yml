name: Test portfolio projects
on:
  push:
  pull_request:
jobs:
  taxi-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/nyc-taxi-trip-duration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
